{% extends 'base.html' %}
{% block content %}
<!-- الهيدر فيه الاسم وزرار تسجيل الخروج -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">To-Do</h2>
    <div>
        <span class="me-3 fw-bold">Hi, {{ session['name'] }}</span>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm">Log out</a>
    </div>
</div>

<!-- فورم إضافة مهمة جديدة -->
<form method="POST" action="{{ url_for('add_todo') }}" class="d-flex mb-4">
    <input type="text" name="title" class="form-control me-2" placeholder="What needs to be done?" required maxlength="200">
    <button type="submit" class="btn btn-primary">Add</button>
</form>

<!-- عرض قائمة المهام -->
<ul class="list-group shadow-sm">
    {% for todo in todos %}
    <li class="list-group-item d-flex align-items-center justify-content-between p-3">
        <div class="d-flex align-items-center w-100 me-3">
            
            <!-- زرار الـ Checkbox (تغيير حالة المهمة) -->
            <form method="POST" action="{{ url_for('toggle_todo', todo_id=todo.todo_id) }}" class="me-3 mb-0">
                <input type="hidden" name="is_done" value="{{ 0 if todo.is_done else 1 }}">
                <input type="checkbox" onchange="this.form.submit()" class="form-check-input mt-0 fs-5" {% if todo.is_done %}checked{% endif %}>
            </form>
            
            <!-- فورم تعديل اسم المهمة -->
            <form method="POST" action="{{ url_for('edit_todo', todo_id=todo.todo_id) }}" class="w-100 mb-0 d-flex align-items-center">
                <input type="text" name="title" value="{{ todo.title }}" class="form-control form-control-sm border-0 {% if todo.is_done %}text-decoration-line-through text-muted{% endif %}" required>
                <button type="submit" class="btn btn-sm btn-light ms-2 text-secondary">Save</button>
            </form>
        </div>
        
        <!-- زرار الحذف -->
        <form method="POST" action="{{ url_for('delete_todo', todo_id=todo.todo_id) }}" class="mb-0" onsubmit="return confirm('Are you sure you want to delete this?');">
            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
        </form>
    </li>
    {% else %}
    <!-- رسالة بتظهر لو القائمة فاضية -->
    <li class="list-group-item text-center text-muted py-5">
        Your list is empty. Start adding some tasks!
    </li>
    {% endfor %}
</ul>
{% endblock %}
